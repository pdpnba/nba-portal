<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dr. Panjabrao Deshmukh Polytechnic, NBA Portal</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
  :root{
    --navy:#122a52;
    --navy-2:#1c3a5e;
    --maroon:#8f1d1d;
    --maroon-2:#b32c2c;
    --saffron:#e08a1e;
    --paper:#fbf6ec;
    --card:#ffffff;
    --ink:#1c2430;
    --ink-soft:#5b6472;
    --line:#e7dfc9;
    --amber:#d69422;
    --amber-soft:#fbe8bf;
    --teal:#1f7a6c;
    --teal-soft:#d7efe9;
    --red:#a4433a;
    --red-soft:#f3ddd9;
    --radius:12px;
    --font-display: 'Iowan Old Style', 'Palatino Linotype', Georgia, serif;
    --font-body: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
    --font-mono: 'SF Mono', Consolas, monospace;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:14.5px;line-height:1.5;}
  h1,h2,h3{font-family:var(--font-display);font-weight:600;margin:0 0 8px;color:var(--navy);}
  a{color:var(--teal);}
  button{font-family:var(--font-body);cursor:pointer;}
  input,select,textarea{font-family:var(--font-body);font-size:14px;}
  ::selection{background:var(--amber-soft);}

  /* ---------- Login ---------- */
  #login-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;background:
    radial-gradient(circle at 12% 15%, rgba(255,255,255,0.10), transparent 42%),
    radial-gradient(circle at 88% 85%, rgba(224,138,30,0.18), transparent 45%),
    linear-gradient(150deg,var(--maroon) 0%, var(--navy) 55%, var(--navy-2) 100%);}
  .banner-card{background:#fff;border-radius:16px;padding:14px 22px;box-shadow:0 25px 60px rgba(0,0,0,.4);margin-bottom:8px;max-width:min(94vw,920px);}
  .banner-card img{display:block;width:100%;height:auto;}
  .rainbow-bar{height:5px;width:100%;max-width:min(94vw,920px);border-radius:4px;margin-bottom:30px;background:linear-gradient(90deg,var(--saffron),#ffffff,var(--teal),var(--navy));box-shadow:0 4px 14px rgba(0,0,0,.25);}
  .brand{text-align:center;margin-bottom:30px;}
  .brand .mark{width:58px;height:58px;margin:0 auto 14px;border:2px solid var(--amber);border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--amber);font-family:var(--font-display);font-size:16px;font-weight:700;letter-spacing:.5px;}
  .brand h1{color:#fff;font-size:24px;letter-spacing:.3px;margin-bottom:4px;text-shadow:0 2px 10px rgba(0,0,0,.3);}
  .brand p{color:#f4e3c4;font-size:20px;letter-spacing:1.5px;text-transform:uppercase;}
  .role-grid{display:grid;grid-template-columns:repeat(2,220px);gap:16px;}
  @media (max-width:520px){.role-grid{grid-template-columns:1fr;}}
  .role-card{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.2);border-top:3px solid var(--role-accent,var(--amber));border-radius:var(--radius);padding:20px;color:#eef2f7;cursor:pointer;transition:.18s;text-align:left;}
  .role-card:hover{background:rgba(255,255,255,0.16);border-color:var(--role-accent,var(--amber));transform:translateY(-3px);box-shadow:0 10px 24px rgba(0,0,0,.25);}
  .role-card .num{font-family:var(--font-mono);font-size:11px;color:var(--role-accent,var(--amber));letter-spacing:1px;font-weight:700;}
  .role-card h3{color:#fff;font-size:16.5px;margin:6px 0 4px;}
  .role-card p{color:#cdd8e6;font-size:12.5px;margin:0;}
  .role-card[data-role="admin"]{--role-accent:#e08a1e;}
  .role-card[data-role="teacher"]{--role-accent:#3fb6a3;}
  .role-card[data-role="student"]{--role-accent:#f2c14e;}
  .role-card[data-role="guest"]{--role-accent:#e0645a;}

  .login-form{background:var(--card);border-radius:var(--radius);padding:28px 26px;width:340px;box-shadow:0 20px 50px rgba(0,0,0,.35);border-top:4px solid var(--amber);}
  .login-form h3{font-size:17px;}
  .login-form label{display:block;font-size:12px;color:var(--ink-soft);margin:14px 0 5px;text-transform:uppercase;letter-spacing:.6px;}
  .login-form input,.login-form select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:#fbfaf7;}
  .btn{display:inline-block;border:none;border-radius:6px;padding:10px 18px;font-size:13.5px;font-weight:600;letter-spacing:.2px;transition:.15s;}
  .btn-primary{background:linear-gradient(135deg,var(--navy),var(--navy-2));color:#fff;}
  .btn-primary:hover{filter:brightness(1.12);transform:translateY(-1px);}
  .btn-amber{background:linear-gradient(135deg,var(--amber),var(--saffron));color:#fff;}
  .btn-outline{background:transparent;border:1px solid var(--line);color:var(--ink);}
  .btn-danger{background:var(--red-soft);color:var(--red);border:1px solid #e3bdb6;}
  .btn-full{width:100%;margin-top:18px;}
  .back-link{margin-top:16px;display:block;width:100%;max-width:340px;box-sizing:border-box;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.3);color:#f4e3c4;font-size:15px;font-weight:600;padding:12px 16px;border-radius:8px;text-decoration:none;cursor:pointer;text-align:center;transition:.18s;}
  .back-link:hover{background:rgba(255,255,255,0.18);}
  .form-error{color:#ffd2d2;font-size:12px;margin-top:8px;}

  /* ---------- App shell ---------- */
  #app-screen{display:none;min-height:100vh;}
  .topbar{background:#fffdf8;color:var(--ink);display:flex;align-items:center;justify-content:space-between;padding:8px 22px;border-bottom:4px solid transparent;border-image:linear-gradient(90deg,var(--saffron),var(--maroon-2),var(--navy)) 1;box-shadow:0 2px 10px rgba(0,0,0,.08);}
  .topbar .t-left{display:flex;align-items:center;gap:12px;}
  .topbar .banner-img{height:52px;width:auto;display:block;}
  .topbar .title{font-family:var(--font-display);font-size:16px;color:var(--navy);}
  .topbar .who{font-size:12.5px;color:var(--ink-soft);}
  .topbar .who b{color:var(--navy);}
  .topbar .t-right{display:flex;align-items:center;gap:14px;}
  .logout-btn{background:linear-gradient(135deg,var(--maroon),var(--maroon-2));border:none;color:#fff;padding:8px 16px;border-radius:6px;font-size:12.5px;font-weight:600;box-shadow:0 3px 10px rgba(143,29,29,.25);}
  .logout-btn:hover{filter:brightness(1.1);transform:translateY(-1px);}

  .layout{display:flex;align-items:flex-start;justify-content:center;}
  .sidebar{width:230px;flex-shrink:0;background:linear-gradient(180deg,#f3ead2,#eee9db);min-height:calc(100vh - 68px);padding:18px 0;border-right:1px solid var(--line);}
  .sidebar .grp-label{font-size:10.5px;text-transform:uppercase;letter-spacing:1px;color:var(--maroon);font-weight:700;padding:14px 20px 6px;}
  .side-link{display:flex;align-items:center;gap:9px;padding:9px 20px;font-size:13.5px;color:var(--ink);cursor:pointer;border-left:3px solid transparent;}
  .side-link:hover{background:#e3dcc9;}
  .side-link.active{background:#fff;border-left-color:var(--amber);font-weight:600;color:var(--navy);box-shadow:inset 0 0 0 1px var(--line);}
  .side-link .dot{width:5px;height:5px;border-radius:50%;background:var(--ink-soft);}
  .side-link.active .dot{background:var(--amber);}

  .content{flex:1;padding:26px 32px;max-width:1180px;margin:0 auto;}
  .crumb{font-size:11.5px;color:var(--maroon);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;text-align:center;font-weight:700;}
  .page-head{display:flex;flex-direction:column;align-items:center;text-align:center;margin-bottom:22px;gap:4px;}
  .page-head p.sub{color:var(--ink-soft);font-size:13px;margin:2px 0 0;}

  .card{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--amber);border-radius:var(--radius);padding:20px 22px;margin-bottom:18px;box-shadow:0 3px 14px rgba(20,30,50,.05);}
  .card h3{font-size:15px;margin-bottom:12px;color:var(--maroon);}
  .tag{display:inline-block;font-size:10.5px;padding:2px 8px;border-radius:20px;letter-spacing:.4px;text-transform:uppercase;font-weight:600;}
  .tag-amber{background:var(--amber-soft);color:#8a5c17;}
  .tag-teal{background:var(--teal-soft);color:var(--teal);}
  .tag-red{background:var(--red-soft);color:var(--red);}

  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;}
  th{background:#f2efe4;font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-soft);font-weight:600;}
  tr:hover td{background:#faf8f2;}
  .table-wrap{overflow-x:auto;}

  .tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:18px;flex-wrap:wrap;justify-content:center;}
  .tab-btn{padding:9px 16px;font-size:13px;background:none;border:none;border-bottom:2px solid transparent;color:var(--ink-soft);}
  .tab-btn.active{color:var(--maroon);border-bottom-color:var(--amber);font-weight:600;}

  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px;}
  .field input,.field select,.field textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:#fbfaf7;}
  .row-flex{display:flex;gap:12px;flex-wrap:wrap;}
  .row-flex .field{flex:1;min-width:160px;}

  .empty{padding:30px;text-align:center;color:var(--ink-soft);border:1px dashed var(--line);border-radius:var(--radius);font-size:13px;}
  .toast{position:fixed;top:18px;right:18px;background:var(--navy);color:#fff;padding:12px 18px;border-radius:8px;font-size:13px;box-shadow:0 10px 25px rgba(0,0,0,.25);z-index:999;opacity:0;transform:translateY(-8px);transition:.25s;pointer-events:none;}
  .toast.show{opacity:1;transform:translateY(0);pointer-events:auto;}
  .icon-btn{background:none;border:none;color:var(--red);font-size:12px;cursor:pointer;text-decoration:underline;}
  .small-note{font-size:11.5px;color:var(--ink-soft);margin-top:4px;}
  .rating-group{display:flex;gap:8px;}
  .rating-opt{flex:1;text-align:center;border:1px solid var(--line);border-radius:6px;padding:8px 4px;font-size:12px;cursor:pointer;}
  .rating-opt.sel{background:var(--navy);color:#fff;border-color:var(--navy);}
  .co-block{border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:10px;background:#fbfaf7;}
  .co-block .co-q{font-size:13px;margin-bottom:8px;}
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:16px;}
  .stat-box{background:linear-gradient(160deg,#fff,#fbf6ec);border:1px solid var(--line);border-radius:8px;padding:12px 14px;text-align:center;}
  .stat-box .v{font-family:var(--font-display);font-size:22px;color:var(--maroon);}
  .stat-box .l{font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.5px;}
  .badge-level{display:inline-block;padding:2px 9px;border-radius:5px;font-size:12px;font-weight:700;}
  .lvl-3{background:#dcece9;color:#1f5a52;}
  .lvl-2{background:#f4e3c4;color:#8a5c17;}
  .lvl-1{background:#f3e3c2;color:#8a5c17;}
  .lvl-0{background:#f3ddd9;color:#a4433a;}
  .matrix-input{width:44px;text-align:center;padding:5px;}
  .assumption-box{background:#f2efe4;border-left:3px solid var(--amber);padding:10px 14px;font-size:12px;color:var(--ink-soft);border-radius:0 6px 6px 0;margin-bottom:16px;}
  .file-drop{border:1.5px dashed var(--line);border-radius:8px;padding:20px;text-align:center;font-size:12.5px;color:var(--ink-soft);}
  .link-btn{background:none;border:none;color:var(--teal);text-decoration:underline;font-size:12.5px;padding:0;}
</style>
</head>

<script>
/* ======================================================================
   STATE & STORAGE HELPERS
   ====================================================================== */
const state = {
  role: null,        // admin | teacher | student | guest
  name: null,
  userId: null,
  semester: null,     // for student
  enrollment: null,   // for student
  courses: [],
  industries: [],
  view: null,
  sub: {}             // per-view sub state (selected course id, active tab etc)
};

/* ----------------------------------------------------------------------
   GOOGLE SHEET STORAGE
   Paste the "Web app" URL you get after deploying the Apps Script
   (see Code.gs) between the quotes below. It ends in /exec.
   ---------------------------------------------------------------------- */
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwomhiV4lAZow6lZEPsprGaOt91sqQGhJRw7gBNYFdexU31CW8WMg0kUOkxptbZolKR/exec';

let kvCache = {};
let cacheLoaded = false;
let sheetUnreachable = false;

async function refreshCache(){
  try{
    const res = await fetch(APPS_SCRIPT_URL + '?action=all&t=' + Date.now());
    if(!res.ok) throw new Error('HTTP '+res.status);
    const data = await res.json();
    kvCache = data.values || {};
    cacheLoaded = true;
    sheetUnreachable = false;
  }catch(e){
    console.error('Could not reach Google Sheet', e);
    sheetUnreachable = true;
    if(cacheLoaded) toast('Could not reach the Google Sheet — showing last-loaded data.');
  }
}

async function sGet(key){
  if(!cacheLoaded) await refreshCache();
  try{
    const raw = kvCache[key];
    return (raw!==undefined && raw!==null && raw!=='') ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
async function sSet(key, val){
  kvCache[key] = JSON.stringify(val); // update local cache immediately so the UI feels instant
  try{
    const res = await fetch(APPS_SCRIPT_URL, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'}, // avoids a CORS preflight against Apps Script
      body: JSON.stringify({key, value: JSON.stringify(val)})
    });
    if(!res.ok) throw new Error('HTTP '+res.status);
  }catch(e){
    console.error('storage set failed', key, e);
    toast('Could not save to the Google Sheet — check your connection.');
  }
}
async function sDelete(key){
  kvCache[key] = null;
  try{
    const res = await fetch(APPS_SCRIPT_URL, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({key, value: JSON.stringify(null)})
    });
    if(!res.ok) throw new Error('HTTP '+res.status);
  }catch(e){
    console.error('storage delete failed', key, e);
    toast('Could not delete on the Google Sheet — check your connection.');
  }
}
function uid(prefix){ return prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}

function showSetupScreen(){
  document.getElementById('role-select').style.display='none';
  document.getElementById('login-form-holder').style.display='block';
  document.getElementById('login-form-holder').innerHTML = `
    <div class="login-form" style="width:420px;">
      <h3>One-time setup needed</h3>
      <p class="small-note" style="font-size:12.5px;line-height:1.6;">
        This portal stores its data in a Google Sheet. Before anyone can log in, open
        <b>Code.gs</b> (provided alongside this file), follow the deployment steps, then paste your
        Web App URL into the <code>APPS_SCRIPT_URL</code> constant near the top of this file's
        &lt;script&gt; section and re-upload it.
      </p>
    </div>`;
}
if(APPS_SCRIPT_URL.indexOf('PASTE_YOUR_DEPLOYMENT_URL_HERE')!==-1){
  showSetupScreen();
} else {
  refreshCache();
}

/* ======================================================================
   LOGIN — real username/password credentials, checked against
   accounts stored locally. Admin has a default account; Admin creates
   Teacher and Student accounts under Administration → Manage Users.
   ====================================================================== */
const roleMeta = {
  admin:{label:'Admin / Coordinator', fields:['name']},
  teacher:{label:'Teacher', fields:['name']},
  student:{label:'Student', fields:['name','semester','enrolled']},
  guest:{label:'Parent / Industry / Alumni', fields:[]}
};

async function ensureDefaultAdmin(){
  const users = await sGet('users');
  if(!users){
    await sSet('users', [{id:uid('usr'), role:'admin', username:'admin', password:'admin@123', name:'Administrator'}]);
  }
}
if(APPS_SCRIPT_URL.indexOf('PASTE_YOUR_DEPLOYMENT_URL_HERE')===-1){
  ensureDefaultAdmin();
}

document.querySelectorAll('.role-card').forEach(card=>{
  card.addEventListener('click', async ()=>{
    const role = card.dataset.role;
    if(role==='guest'){ enterGuestFlow(); return; }
    await showLoginForm(role);
  });
});

document.getElementById('back-to-roles').addEventListener('click', ()=>{
  document.getElementById('role-select').style.display='grid';
  document.getElementById('login-form-holder').style.display='none';
  document.getElementById('login-form-holder').innerHTML='';
  document.getElementById('back-to-roles').style.display='none';
});

async function showLoginForm(role){
  await loadCoursesIfNeeded();
  document.getElementById('role-select').style.display='none';
  document.getElementById('back-to-roles').style.display='block';
  const holder = document.getElementById('login-form-holder');
  holder.style.display='block';

  const helpNote = role==='admin'
    ? `<p class="small-note">Default account: <b>admin</b> / <b>admin@123</b> — change this after first login under Administration → Manage Users.</p>`
    : `<p class="small-note">Use the username &amp; password your Admin/Coordinator gave you. Don&rsquo;t have one yet? Ask your Admin to create it under Manage Users.</p>`;

  holder.innerHTML = `
    <div class="login-form">
      <h3>${roleMeta[role].label} Login</h3>
      <label>Username</label>
      <input id="lf-username" type="text" placeholder="Enter your username" autocomplete="username" />
      <label>Password</label>
      <input id="lf-password" type="password" placeholder="Enter your password" autocomplete="current-password" />
      ${helpNote}
      <div class="form-error" id="lf-error"></div>
      <button class="btn btn-primary btn-full" id="lf-submit">Login</button>
    </div>
  `;
  const doSubmit = async ()=>{
    const username = document.getElementById('lf-username').value.trim();
    const password = document.getElementById('lf-password').value;
    const errEl = document.getElementById('lf-error');
    errEl.textContent = '';
    if(!username || !password){ errEl.textContent='Please enter both username and password.'; return; }
    const users = (await sGet('users')) || [];
    const match = users.find(u=>u.role===role && u.username.toLowerCase()===username.toLowerCase() && u.password===password);
    if(!match){ errEl.textContent='Invalid username or password.'; return; }
    state.role = role;
    state.name = match.name;
    state.userId = match.id;
    if(role==='student'){ state.semester = match.semester || 1; state.enrollment = match.enrollment || ''; }
    loginSuccess();
  };
  document.getElementById('lf-submit').addEventListener('click', doSubmit);
  document.getElementById('lf-password').addEventListener('keydown', e=>{ if(e.key==='Enter') doSubmit(); });
}

function enterGuestFlow(){
  state.role='guest';
  state.name=null;
  loginSuccess();
}

function loginSuccess(){
  toast('Login Successful');
  document.getElementById('login-screen').style.display='none';
  document.getElementById('app-screen').style.display='block';
  document.getElementById('who-name').textContent = state.name || 'Guest';
  document.getElementById('who-role').textContent = roleMeta[state.role].label;
  buildSidebar();
}

document.getElementById('logout-btn').addEventListener('click', ()=>{
  state.role=null; state.name=null; state.semester=null; state.enrollment=null; state.userId=null; state.view=null; state.sub={};
  document.getElementById('app-screen').style.display='none';
  document.getElementById('login-screen').style.display='flex';
  document.getElementById('role-select').style.display='grid';
  document.getElementById('login-form-holder').style.display='none';
  document.getElementById('login-form-holder').innerHTML='';
  document.getElementById('back-to-roles').style.display='none';
});

      {id:'guest-industry', label:'Industry Feedback Survey'},
      {id:'guest-alumni', label:'Alumni Feedback Survey'},
    ]}
  ]
};

function buildSidebar(){
  const sb = document.getElementById('sidebar');
  const groups = menus[state.role];
  let html='';
  groups.forEach(g=>{
    html += `<div class="grp-label">${g.grp}</div>`;
    g.items.forEach(it=>{
      if(it.requireSem6 && state.semester!==6) return;
      html += `<div class="side-link" data-view="${it.id}"><span class="dot"></span>${it.label}</div>`;
    });
  });
  sb.innerHTML = html;
  sb.querySelectorAll('.side-link').forEach(el=>{
    el.addEventListener('click', ()=>navigate(el.dataset.view));
  });
  // default view = first item
  const firstGroup = groups.find(g=>g.items.some(it=>!it.requireSem6 || state.semester===6));
  const firstItem = firstGroup.items.find(it=>!it.requireSem6 || state.semester===6);
  navigate(firstItem.id);
}

function navigate(view){
  state.view = view;
  document.querySelectorAll('.side-link').forEach(el=>{
    el.classList.toggle('active', el.dataset.view===view);
  });
  renderView(view);
}

async function renderView(view){
  const c = document.getElementById('content');
  c.innerHTML = `<div class="empty">Loading…</div>`;
  await refreshCache();
  state.courses = []; // force a fresh read so courses added elsewhere show up
  const renderers = {
    'users': renderUsers,
    'students': renderStudentRoster,
    'survey-params': renderSurveyParams,
    'survey-responses': renderSurveyResponses,
    'industries': renderIndustries,
    'courses': renderCourses,
    'results': renderResults,
    'copo': renderCopo,
    'attainment': renderAttainment,
    'ces-fill': ()=>renderStakeholderSurveyFill('student'),
    'pes-fill': ()=>renderPOSurveyFill('program'),
    'guest-parent': ()=>renderPOSurveyFill('parent'),
    'guest-industry': ()=>renderPOSurveyFill('industry'),
    'guest-alumni': ()=>renderPOSurveyFill('alumni'),
  };
  if(renderers[view]) await renderers[view]();
  else c.innerHTML = `<div class="empty">Not found</div>`;
}

async function loadCoursesIfNeeded(){
  if(state.courses.length===0){
    const c = await sGet('courses');
    state.courses = c || [];
  }
}

    await sSet('users', users);

    renderUsers();

      ['2400123456','Aarav Sharma','aarav2400123456','Aarav@123',1],
      ['2400123457','Isha Patil','isha2400123457','Isha@123',1],
    ];
    const ws = XLSX.utils.aoa_to_sheet(aoa);
    ws['!cols'] = [{wch:18},{wch:22},{wch:20},{wch:14},{wch:10}];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Students');
    XLSX.writeFile(wb, 'student_bulk_add_template.xlsx');
  });

  const bulkFile = document.getElementById('s-bulk-file');
  if(bulkFile) bulkFile.addEventListener('change', async (e)=>{
    const file = e.target.files[0]; if(!file) return;
    const data = await file.arrayBuffer();
    const wb = XLSX.read(data, {type:'array'});
    const ws = wb.Sheets[wb.SheetNames[0]];
    const json = XLSX.utils.sheet_to_json(ws, {header:1, defval:''});
    let added = 0, skipped = 0;
    const reasons = {};
    const flag = (r)=>{ reasons[r]=(reasons[r]||0)+1; skipped++; };
    json.forEach(row=>{
      if(row.every(cell=>String(cell).trim()==='')) return; // ignore fully blank rows silently
      const enrollment = String(row[0]||'').trim();
      const name = String(row[1]||'').trim();
      const username = String(row[2]||'').trim();
      const password = String(row[3]||'').trim();
      const semester = parseInt(row[4],10);
      if(!enrollment || !/^\d+$/.test(enrollment)){ flag('Enrollment Number missing or not numeric (e.g. header row)'); return; }
      if(!name){ flag('Full Name missing'); return; }
      if(!username){ flag('Username missing'); return; }
      if(!password){ flag('Password missing'); return; }
      if(!(semester>=1 && semester<=6)){ flag('Semester missing or not 1-6'); return; }
      if(users.some(u=>u.username.toLowerCase()===username.toLowerCase())){ flag('Username already exists'); return; }
      users.push({id:uid('usr'), role:'student', name, username, password, semester, enrollment});
      added++;
    });
    if(added===0){
      const reasonText = Object.entries(reasons).map(([r,n])=>`${n}× ${r}`).join('; ');
      toast('No valid rows found — check the template. '+(reasonText||''));
      return;
    }
    await sSet('users', users);
    const reasonText = Object.entries(reasons).map(([r,n])=>`${n}× ${r}`).join(', ');
    toast(added+' student account(s) created'+(skipped?`, ${skipped} row(s) skipped (${reasonText})`:''));
    renderUsers();
  });

  const deleteAllBtn = document.getElementById('s-delete-all');
  if(deleteAllBtn) deleteAllBtn.addEventListener('click', async ()=>{
    if(!confirm(`Remove all ${students.length} student login account(s)? This cannot be undone.`)) return;
    const remaining = users.filter(u=>u.role!=='student');
    await sSet('users', remaining);
    toast('All student accounts removed');
    renderUsers();
  });
}

/* ======================================================================
   ADMIN: STUDENT ROSTER (bulk upload / bulk delete, semester-wise)
   ====================================================================== */
async function renderStudentRoster(){
  const c = document.getElementById('content');
  const sem = state.sub.rosterSem || 1;
  state.sub.rosterSem = sem;
  const roster = (await sGet('students_roster')) || [];
  const inSem = roster.filter(s=>s.semester===sem);

  c.innerHTML = `
    <div class="crumb">Administration</div>
    <div class="page-head"><div><h2>Student Roster</h2><p class="sub">Upload the current student list semester-wise — this drives who can be looked up in surveys and reports.</p></div></div>
    <div class="tabs">
      ${[1,2,3,4,5,6].map(n=>`<button class="tab-btn ${sem===n?'active':''}" data-sem="${n}">Sem ${n}</button>`).join('')}
    </div>
    <div class="card">
      <h3>Bulk Upload — Semester ${sem}</h3>
      <p class="small-note">Excel/CSV columns, in order: <b>Enrollment Number, Student Name, Division, Academic Year</b>. First row can be a header — non-numeric enrollment numbers in row 1 are skipped automatically.</p>
      <div class="file-drop">
        <input type="file" id="roster-file" accept=".xlsx,.xls,.csv" />
        <p style="margin-top:8px;">Choose a file for Semester ${sem}</p>
      </div>
    </div>
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">
        <h3 style="margin:0;">Semester ${sem} Students (${inSem.length})</h3>
        ${inSem.length>0?`<button class="btn btn-danger" id="roster-clear">Bulk Delete — Semester ${sem}</button>`:''}
      </div>
      ${inSem.length===0?'<div class="empty">No students uploaded for this semester yet.</div>':`
      <div class="table-wrap"><table>
        <tr><th>Enrollment No.</th><th>Name</th><th>Division</th><th>Academic Year</th><th></th></tr>
        ${inSem.map(s=>`<tr><td>${s.enrollment}</td><td>${s.name}</td><td>${s.division||''}</td><td>${s.academicYear||''}</td><td><button class="icon-btn" data-del="${s.id}">Remove</button></td></tr>`).join('')}
      </table></div>`}
    </div>
  `;
  c.querySelectorAll('[data-sem]').forEach(b=>b.addEventListener('click', ()=>{ state.sub.rosterSem=parseInt(b.dataset.sem,10); renderStudentRoster(); }));

  document.getElementById('roster-file').addEventListener('change', async (e)=>{
    const file = e.target.files[0]; if(!file) return;
    const data = await file.arrayBuffer();
    const wb = XLSX.read(data, {type:'array'});
    const ws = wb.Sheets[wb.SheetNames[0]];
    const json = XLSX.utils.sheet_to_json(ws, {header:1, defval:''});
    let added = 0, skipped = 0;
    json.forEach(row=>{
      const enrollment = String(row[0]||'').trim();
      const name = String(row[1]||'').trim();
      if(!enrollment || !/^\d+$/.test(enrollment) || !name){ skipped++; return; }
      const division = String(row[2]||'').trim();
      const academicYear = String(row[3]||'').trim();
      const existingIdx = roster.findIndex(s=>s.enrollment===enrollment && s.semester===sem);
      const rec = {id: existingIdx>-1?roster[existingIdx].id:uid('stu'), enrollment, name, semester:sem, division, academicYear};
      if(existingIdx>-1) roster[existingIdx]=rec; else roster.push(rec);
      added++;
    });
    if(added===0){ toast('No valid rows found — check the column order'); return; }
    await sSet('students_roster', roster);
    toast(added+' student(s) added/updated'+(skipped?`, ${skipped} row(s) skipped`:''));
    renderStudentRoster();
  });

  const clearBtn = document.getElementById('roster-clear');
  if(clearBtn) clearBtn.addEventListener('click', async ()=>{
    if(!confirm(`Remove all ${inSem.length} student(s) from Semester ${sem}? This cannot be undone.`)) return;
    const remaining = roster.filter(s=>s.semester!==sem);
    await sSet('students_roster', remaining);
    toast('Semester '+sem+' roster cleared');
    renderStudentRoster();
  });

  c.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click', async ()=>{
    const remaining = roster.filter(s=>s.id!==b.dataset.del);
    await sSet('students_roster', remaining);
    renderStudentRoster();
  }));
}

/* ======================================================================
   ADMIN: SURVEY PARAMETERS
   (Course Exit Survey = per-course CO questions;
    Program/Parent/Industry/Alumni share one PO/PSO parameter set)
   ====================================================================== */
async function renderSurveyParams(){
  await loadCoursesIfNeeded();

async function renderCourseParamsTab(){
  const body = document.getElementById('sp-body');
  if(state.courses.length===0){ body.innerHTML = `<div class="empty">Add courses first under Academics → Manage Courses.</div>`; return; }
  const selId = state.sub.spCourseId || state.courses[0].id;
  state.sub.spCourseId = selId;
  const params = (await sGet('ces_params:'+selId)) || [];
  body.innerHTML = `
    <div class="card">
      <div class="field" style="max-width:320px;"><label>Course</label>
        <select id="sp-course-select">${state.courses.map(co=>`<option value="${co.id}" ${co.id===selId?'selected':''}>${co.code} — ${co.name}</option>`).join('')}</select>
      </div>
      <h3>Course Outcomes (CO) for this survey</h3>
      <div id="co-list">
        ${params.length===0?'<div class="empty">No COs defined yet.</div>':params.map((p,i)=>`
          <div class="co-block">
            <div class="row-flex" style="align-items:center;">
              <div class="field" style="max-width:120px;"><label>CO Code</label><input value="${p.code}" data-co-code="${p.id}"/></div>
              <div class="field" style="flex:3;"><label>CO Statement</label><input value="${p.text}" data-co-text="${p.id}"/></div>
              <button class="icon-btn" data-co-del="${p.id}">Remove</button>
            </div>
          </div>`).join('')}
      </div>
      <button class="btn btn-outline" id="co-add">+ Add CO</button>
      <button class="btn btn-primary" id="co-save" style="margin-left:8px;">Save Parameters</button>
      <div class="file-drop" style="margin-top:16px;">
        <input type="file" id="co-file" accept=".xlsx,.xls,.csv" />
        <p style="margin-top:8px;">Or bulk-upload COs for this subject — first column = CO code (optional, auto-filled if blank), second column = CO statement, one CO per row.</p>
      </div>
    </div>
  `;
  document.getElementById('sp-course-select').addEventListener('change', e=>{ state.sub.spCourseId=e.target.value; renderSurveyParams(); });
  const coFile = document.getElementById('co-file');
  if(coFile) coFile.addEventListener('change', async (e)=>{
    const file = e.target.files[0]; if(!file) return;
    const course = state.courses.find(x=>x.id===selId);
    const data = await file.arrayBuffer();
    const wb = XLSX.read(data, {type:'array'});
    const ws = wb.Sheets[wb.SheetNames[0]];
    const json = XLSX.utils.sheet_to_json(ws, {header:1, defval:''});
    let added = 0;
    json.forEach(row=>{
      const text = (row[1]!==undefined && row[1]!=='') ? String(row[1]) : (row[0]!==undefined ? String(row[0]) : '');
      if(!text) return;
      const codeGiven = (row[1]!==undefined && row[1]!=='') ? String(row[0]) : '';
      const code = codeGiven || ((course?course.code:'CO')+'.'+(params.length+1));
      params.push({id:uid('co'), code, text: row[1]!==undefined && row[1]!=='' ? String(row[1]) : text});
      added++;
    });
    if(added===0){ toast('No rows found to import'); return; }
    await sSet('ces_params:'+selId, params);
    toast(added+' Course Outcome(s) imported');
    renderSurveyParams();
  });
  document.getElementById('co-add').addEventListener('click', async ()=>{
    const course = state.courses.find(x=>x.id===selId);
    params.push({id:uid('co'), code:(course?course.code:'CO')+'.'+(params.length+1), text:''});
    await sSet('ces_params:'+selId, params);
    renderSurveyParams();
  });
  document.querySelectorAll('[data-co-del]').forEach(b=>b.addEventListener('click', async ()=>{
    const np = params.filter(p=>p.id!==b.dataset.coDel);
    await sSet('ces_params:'+selId, np);
    renderSurveyParams();
  }));
  const saveBtn = document.getElementById('co-save');
  if(saveBtn) saveBtn.addEventListener('click', async ()=>{
    document.querySelectorAll('[data-co-code]').forEach(inp=>{
      const p = params.find(x=>x.id===inp.dataset.coCode); if(p) p.code=inp.value;
    });
    document.querySelectorAll('[data-co-text]').forEach(inp=>{
      const p = params.find(x=>x.id===inp.dataset.coText); if(p) p.text=inp.value;
    });
    await sSet('ces_params:'+selId, params);
    toast('Saved');
  });
}

/* ======================================================================
   SUBJECT-WISE CO SURVEY ENGINE (shared by Student, Parent, Alumni, Industry)
   Layout matches the institute's Course Exit Survey format: one row per
   respondent, columns grouped by Subject → Course Outcome.
   ====================================================================== */
async function buildSubjectColumns(semester){
  await loadCoursesIfNeeded();
  const subs = state.courses.filter(co=>co.semester===semester);
  const cols = [];
  for(const course of subs){
    const cos = (await sGet('ces_params:'+course.id)) || [];
    cols.push({course, cos});
  }
  return cols; // [{course:{id,code,name,semester}, cos:[{id,code,text}]}]
}

function renderSubjectGroupHeader(subjectCols, firstColLabel){
  const groupRow = `<tr><th rowspan="2" style="min-width:170px;vertical-align:bottom;">${firstColLabel}</th>${subjectCols.map(sc=>`<th colspan="${sc.cos.length||1}" style="text-align:center;">${sc.course.code}<div style="font-weight:400;text-transform:none;font-size:11px;">${sc.course.name}</div></th>`).join('')}</tr>`;
  const coRow = `<tr>${subjectCols.map(sc=> sc.cos.length? sc.cos.map(co=>`<th style="text-align:center;">${co.code}</th>`).join('') : `<th>&mdash;</th>`).join('')}</tr>`;
  return groupRow+coRow;
}

function identityLabel(kind, r){
  if(kind==='student') return `${r.enrollment} — ${r.name}`;
  if(kind==='parent') return `${r.name} (parent of ${r.studentName||'—'}, Enr. ${r.enrollment||'—'})`;
  if(kind==='alumni') return `${r.name}${r.batch?' — Batch '+r.batch:''}`;
  if(kind==='industry') return `${r.name} — ${r.industry||''}`;
  return r.name||'';
}

const stakeholderTitles = {student:'Course Exit Survey'};

/* ---------- FILL FORM: Course Exit Survey (student only, CO-wise, once per semester) ---------- */
async function renderStakeholderSurveyFill(kind){
  const c = document.getElementById('content');
  await loadCoursesIfNeeded();

  const semester = state.semester || 1;
  const subjectCols = await buildSubjectColumns(semester);
  const totalCos = subjectCols.reduce((n,sc)=>n+(sc.cos.length||0),0);

  const key = 'co_responses:student:'+semester;
  const responses = (await sGet(key)) || [];
  const already = state.enrollment ? responses.find(r=>r.enrollment===state.enrollment) : null;
  if(already){
    c.innerHTML = `
      <div class="crumb">Exit Survey</div>
      <div class="page-head"><div><h2>Course Exit Survey</h2><p class="sub">Rate each Course Outcome for every subject — 1 = Low, 2 = Moderate, 3 = High.</p></div></div>
      <div class="card">
        <div class="empty">You have already submitted the Course Exit Survey for Semester ${semester} on ${new Date(already.submittedAt).toLocaleString()}. Each student may submit this survey only once per semester.</div>
      </div>
    `;
    return;
  }

  c.innerHTML = `
    <div class="crumb">Exit Survey</div>
    <div class="page-head"><div><h2>Course Exit Survey</h2><p class="sub">Rate each Course Outcome for every subject — 1 = Low, 2 = Moderate, 3 = High.</p></div></div>
    <div class="card">
      <p class="small-note">Enrollment Number <b>${state.enrollment||'— (ask Admin to add one to your account)'}</b> &middot; ${state.name} &middot; Semester ${semester}</p>
      ${subjectCols.length===0 ? '<div class="empty">No subjects/Course Outcomes have been set up for this semester yet — ask the Admin to add them under Academics → Manage Courses and Exit Survey → Survey Parameters.</div>' : `
      <div class="card" style="background:#fbf6ec;margin-top:14px;">
        <h3 style="margin-top:0;">Course Outcome (CO) statements</h3>
        ${subjectCols.map(sc=> sc.cos.length ? `
          <p style="margin:6px 0 2px;"><b>${sc.course.code} — ${sc.course.name}</b></p>
          <ul style="margin:0 0 8px 20px;padding:0;">
            ${sc.cos.map(co=>`<li><b>${co.code}:</b> ${co.text||'<span class="small-note">(no statement provided)</span>'}</li>`).join('')}
          </ul>` : '').join('')}
      </div>
      <div class="table-wrap" style="margin-top:14px;">
        <table id="fill-table">
          ${renderSubjectGroupHeader(subjectCols, 'Your Response')}
          <tr>
            <td>${state.enrollment||'—'}</td>
            ${subjectCols.map(sc=> sc.cos.length? sc.cos.map(co=>`<td style="text-align:center;"><select data-co="${sc.course.id}::${co.id}"><option value="">—</option><option value="1">1</option><option value="2">2</option><option value="3">3</option></select></td>`).join('') : `<td>—</td>`).join('')}
          </tr>
        </table>
      </div>
      <button class="btn btn-primary" id="fill-submit" style="margin-top:14px;">Submit Survey</button>`}
    </div>
  `;

  const submitBtn = document.getElementById('fill-submit');
  if(submitBtn) submitBtn.addEventListener('click', async ()=>{
    if(!state.enrollment){ toast('Your account has no Enrollment Number on file — ask Admin to add one under Manage Users.'); return; }
    const ratings = {};
    let answered = 0;
    document.querySelectorAll('#fill-table select[data-co]').forEach(sel=>{
      if(sel.value){ ratings[sel.dataset.co] = parseInt(sel.value,10); answered++; }
    });
    if(answered===0){ toast('Please rate at least one Course Outcome'); return; }
    if(answered<totalCos && !confirm('Some Course Outcomes are left unrated. Submit anyway?')) return;

    const fresh = (await sGet(key)) || [];
    if(fresh.some(r=>r.enrollment===state.enrollment)){
      toast('You have already submitted the Course Exit Survey for this semester.');
      renderStakeholderSurveyFill(kind);
      return;
    }
    fresh.push({id:uid('resp'), enrollment: state.enrollment, name: state.name, semester, ratings, submittedAt:new Date().toISOString()});
    await sSet(key, fresh);
    toast('Survey submitted — thank you!');
    renderStakeholderSurveyFill(kind);
  });
}

/* ---------- PO/PSO-WISE SURVEY (Program Exit / Parent / Alumni / Industry) ----------
   Parent, Industry and Alumni feedback is collected at the Program Outcome / PSO level
   only (not per-Course-Outcome). The Program Exit Survey is filled by students (once
   each) using the same PO/PSO rating grid. All four feed PO/PSO indirect attainment. */
const poSurveyConfig = {
  program: { title:'Program Exit Survey', once:true },
  parent: { title:'Parent Feedback Survey', once:false },
  alumni: { title:'Alumni Feedback Survey', once:false },
  industry: { title:'Industry Feedback Survey', once:false },
};

function poIdentityFieldsHtml(kind, industries){
  if(kind==='program') return '';
  if(kind==='parent') return `<div class="row-flex">
    <div class="field"><label>Your Name (Parent)</label><input id="fill-name"/></div>
    <div class="field"><label>Child's Enrollment Number</label><input id="fill-enrollment"/></div>
    <div class="field"><label>Child's Name</label><input id="fill-student-name"/></div>
  </div>`;
  if(kind==='alumni') return `<div class="row-flex">
    <div class="field"><label>Your Name (Alumni)</label><input id="fill-name"/></div>
    <div class="field"><label>Passing / Batch Year</label><input id="fill-batch"/></div>
  </div>`;
  if(kind==='industry') return `<div class="row-flex">
    <div class="field"><label>Select Industry</label>
      <select id="fill-industry">${industries.length===0?'<option value="">No industries added by admin yet</option>':industries.map(i=>`<option value="${i.id}">${i.name} — ${i.director}</option>`).join('')}</select>
    </div>
    <div class="field"><label>Your Name (Representative)</label><input id="fill-name"/></div>
  </div>`;
  return '';
}

async function renderPOSurveyFill(kind){
  const c = document.getElementById('content');
  if(kind==='program' && state.role==='student' && state.semester!==6){
    c.innerHTML = `
      <div class="crumb">Exit Survey</div>
      <div class="page-head"><div><h2>Program Exit Survey</h2></div></div>
      <div class="card"><div class="empty">The Program Exit Survey is only for Final Year (Semester 6) students. Please use the Course Exit Survey instead.</div></div>
    `;
    return;
  }
  const cfg = poSurveyConfig[kind];
  const pos = (await sGet('program_params')) || [];
  const key = 'po_responses:'+kind;
  const responses = (await sGet(key)) || [];
  let industries = [];
  if(kind==='industry') industries = (await sGet('industries')) || [];

  if(cfg.once){
    const already = state.enrollment ? responses.find(r=>r.enrollment===state.enrollment) : null;
    if(already){
      c.innerHTML = `
        <div class="crumb">Exit Survey</div>
        <div class="page-head"><div><h2>${cfg.title}</h2><p class="sub">This feedback is being taken for continuous improvement in academic, co-curricular, extra curricular and other activities in Institute. This feedback will also be useful for improvement in overall ambience of Institute. Attainment Levels - Low, Medium & High. Rate each Program Outcome / PSO — 1 = Low, 2 = Moderate, 3 = High.</p></div></div>
        <div class="card"><div class="empty">You have already submitted the ${cfg.title} on ${new Date(already.submittedAt).toLocaleString()}. Each student may submit this survey only once.</div></div>
      `;
      return;
    }
  }

  c.innerHTML = `
    <div class="crumb">Exit Survey</div>
    <div class="page-head"><div><h2>${cfg.title}</h2><p class="sub">This feedback is being taken for continuous improvement in academic, co-curricular, extra curricular and other activities in Institute. This feedback will also be useful for improvement in overall ambience of Institute. Attainment Levels - Low, Medium & High. Rate each Program Outcome / PSO — 1 = Low, 2 = Moderate, 3 = High.</p></div></div>
    <div class="card">
      ${kind==='program' ? `<p class="small-note">Enrollment Number <b>${state.enrollment||'— (ask Admin to add one to your account)'}</b> &middot; ${state.name}</p>` : poIdentityFieldsHtml(kind, industries)}
      ${pos.length===0 ? '<div class="empty">No Program Outcomes / PSOs have been set up yet — ask the Admin to add them under Exit Survey → Survey Parameters → Program / Parent / Industry / Alumni.</div>' : `
      <div class="card" style="background:#fbf6ec;margin-top:14px;">
        <h3 style="margin-top:0;">Program Outcome (PO) / PSO statements</h3>
        <ul style="margin:0 0 0 20px;padding:0;">
          ${pos.map(p=>`<li><b>${p.code}:</b> ${p.text||'<span class="small-note">(no statement provided)</span>'}</li>`).join('')}
        </ul>
      </div>
      <div class="table-wrap" style="margin-top:14px;">
        <table id="pos-table">
          <tr><th>Code</th><th>Statement</th><th style="text-align:center;">Rating</th></tr>
          ${pos.map(p=>`<tr><td><b>${p.code}</b></td><td>${p.text||''}</td><td style="text-align:center;"><select data-po="${p.id}"><option value="">—</option><option value="1">1</option><option value="2">2</option><option value="3">3</option></select></td></tr>`).join('')}
        </table>
      </div>
      <button class="btn btn-primary" id="pos-submit" style="margin-top:14px;">Submit Survey</button>`}
    </div>
  `;

  const submitBtn = document.getElementById('pos-submit');
  if(submitBtn) submitBtn.addEventListener('click', async ()=>{
    let identity = {};
    if(kind==='program'){
      if(!state.enrollment){ toast('Your account has no Enrollment Number on file — ask Admin to add one under Manage Users.'); return; }
      identity = { enrollment: state.enrollment, name: state.name };
    } else if(kind==='parent'){
      const name = document.getElementById('fill-name').value.trim();
      const childEnrollment = document.getElementById('fill-enrollment').value.trim();
      const childName = document.getElementById('fill-student-name').value.trim();
      if(!name||!childEnrollment||!childName){ toast("Fill your name, and your child's enrollment number and name"); return; }
      identity = { name, enrollment: childEnrollment, studentName: childName };
    } else if(kind==='alumni'){
      const name = document.getElementById('fill-name').value.trim();
      const batch = document.getElementById('fill-batch').value.trim();
      if(!name){ toast('Enter your name'); return; }
      identity = { name, batch };
    } else if(kind==='industry'){
      const indSel = document.getElementById('fill-industry');
      const ind = industries.find(i=>i.id===indSel.value);
      const name = document.getElementById('fill-name').value.trim();
      if(!ind || !name){ toast('Select an industry and enter your name'); return; }
      identity = { name, industry: ind.name, director: ind.director };
    }

    const ratings = {};
    let answered = 0;
    document.querySelectorAll('#pos-table select[data-po]').forEach(sel=>{
      if(sel.value){ ratings[sel.dataset.po] = parseInt(sel.value,10); answered++; }
    });
    if(answered===0){ toast('Please rate at least one Program Outcome / PSO'); return; }
    if(answered<pos.length && !confirm('Some Program Outcomes / PSOs are left unrated. Submit anyway?')) return;

    const fresh = (await sGet(key)) || [];
    if(cfg.once && fresh.some(r=>r.enrollment===identity.enrollment)){
      toast(`You have already submitted the ${cfg.title}.`);
      renderPOSurveyFill(kind);
      return;
    }
    fresh.push({id:uid('resp'), ...identity, ratings, submittedAt:new Date().toISOString()});
    await sSet(key, fresh);
    toast(`${cfg.title} submitted — thank you!`);
    renderPOSurveyFill(kind);
  });
}

        <button class="btn btn-danger" id="sr-delete-all">Delete All</button>
      </div>
      <div id="sr-table-holder" style="margin-top:14px;"></div>
    </div>
  `;
  c.querySelectorAll('[data-kind]').forEach(b=>b.addEventListener('click', ()=>{ state.sub.srKind=b.dataset.kind; renderSurveyResponses(); }));
  const semSel = document.getElementById('sr-sem');
  if(semSel) semSel.addEventListener('change', e=>{ state.sub.srSem=parseInt(e.target.value,10); renderSurveyResponses(); });

  const pos = !isCoWise ? ((await sGet('program_params')) || []) : [];
  const subjectCols = isCoWise ? await buildSubjectColumns(sem) : [];
  const key = isCoWise ? ('co_responses:student:'+sem) : ('po_responses:'+kind);
  const allResponses = (await sGet(key)) || [];

  function draw(filterText){
    const q = (filterText||'').toLowerCase();
    const filtered = !q ? allResponses : allResponses.filter(r=>{
      const hay = [r.name, r.enrollment, r.studentName, r.industry].filter(Boolean).join(' ').toLowerCase();
      return hay.includes(q);
    });
    document.getElementById('sr-table-holder').innerHTML = isCoWise
      ? renderResponseTable(kind, subjectCols, filtered)
      : renderProgramResponseTable(pos, filtered);
  }
  draw('');
  document.getElementById('sr-search').addEventListener('input', e=>draw(e.target.value));
  document.getElementById('sr-export').addEventListener('click', ()=>{
    if(isCoWise) exportResponsesToExcel(kind, sem, subjectCols, allResponses);
    else exportProgramResponsesToExcel(pos, allResponses, kind);
  });
  document.getElementById('sr-export-pdf').addEventListener('click', async ()=>{
    if(isCoWise) await exportStudentSurveyPDF(sem, subjectCols, allResponses);
    else await exportConsolidatedSurveyPDF(pos);
  });
  document.getElementById('sr-delete-all').addEventListener('click', async ()=>{
    if(allResponses.length===0){ toast('There are no responses to delete.'); return; }
    if(!confirm(`Delete all ${allResponses.length} response(s) for ${isCoWise?(kind+' — Semester '+sem):kind}? This cannot be undone.`)) return;
    await sDelete(key);
    toast('All responses deleted');
    renderSurveyResponses();
  });
}

function renderProgramResponseTable(pos, responses){
  if(pos.length===0) return '<div class="empty">No Program Outcomes / PSOs defined yet.</div>';
  if(responses.length===0) return '<div class="empty">No responses submitted yet.</div>';
  const header = `<tr><th>Respondent</th>${pos.map(p=>`<th style="text-align:center;">${p.code}</th>`).join('')}</tr>`;
  const rows = responses.map(r=>`<tr><td>${r.enrollment?(r.enrollment+' — '+r.name):(r.industry?(r.name+' — '+r.industry):r.name)}</td>${pos.map(p=>{
    const v = r.ratings[p.id];
    return `<td style="text-align:center;">${v!=null?v:''}</td>`;
  }).join('')}</tr>`).join('');
  const avgRow = `<tr style="font-weight:700;background:#fbf6ec;"><td>AVERAGE</td>${pos.map(p=>{
    const vals = responses.map(r=>r.ratings[p.id]).filter(v=>v!=null);
    const avg = vals.length ? (vals.reduce((a,b)=>a+b,0)/vals.length) : 0;
    return `<td style="text-align:center;">${vals.length?avg.toFixed(2):'—'}</td>`;
  }).join('')}</tr>`;
  return `<div class="table-wrap"><table>${header}${rows}${avgRow}</table></div><p class="small-note">${responses.length} response(s) shown.</p>`;
}

function exportProgramResponsesToExcel(pos, responses, kind){
  if(pos.length===0 || responses.length===0){ toast('Nothing to export'); return; }
  const headerRow = ['Enrollment/Industry', 'Name', ...pos.map(p=>p.code)];
  const dataRows = responses.map(r=>[r.enrollment||r.industry||'', r.name||'', ...pos.map(p=>r.ratings[p.id] ?? '')]);
  const avgRow = ['', 'AVERAGE', ...pos.map(p=>{
    const vals = responses.map(r=>r.ratings[p.id]).filter(v=>v!=null);
    return vals.length ? Number((vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(3)) : '';
  })];
  const aoa = [headerRow, ...dataRows, avgRow];
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, (kind||'program')+' Responses');
  XLSX.writeFile(wb, `${kind||'program'}_survey_responses.xlsx`);
}

function flattenCoColumns(subjectCols){
  const flat = [];
  subjectCols.forEach(sc=> (sc.cos.length?sc.cos:[null]).forEach(co=> flat.push({course:sc.course, co})) );
  return flat;
}

function renderResponseTable(kind, subjectCols, responses){
  if(subjectCols.length===0) return '<div class="empty">No subjects/COs defined for this semester yet.</div>';
  if(responses.length===0) return '<div class="empty">No responses submitted yet.</div>';
  const flatCos = flattenCoColumns(subjectCols);
  const header = renderSubjectGroupHeader(subjectCols, 'Respondent');
  const rows = responses.map(r=>`<tr><td>${identityLabel(kind,r)}</td>${flatCos.map(fc=>{
    if(!fc.co) return '<td>—</td>';
    const v = r.ratings[fc.course.id+'::'+fc.co.id];
    return `<td style="text-align:center;">${v!=null?v:''}</td>`;
  }).join('')}</tr>`).join('');
  const avgRow = `<tr style="font-weight:700;background:#fbf6ec;"><td>AVERAGE</td>${flatCos.map(fc=>{
    if(!fc.co) return '<td>—</td>';
    const vals = responses.map(r=>r.ratings[fc.course.id+'::'+fc.co.id]).filter(v=>v!=null);
    const avg = vals.length ? (vals.reduce((a,b)=>a+b,0)/vals.length) : 0;
    return `<td style="text-align:center;">${vals.length?avg.toFixed(2):'—'}</td>`;
  }).join('')}</tr>`;
  return `<div class="table-wrap"><table>${header}${rows}${avgRow}</table></div><p class="small-note">${responses.length} response(s) shown.</p>`;
}

function exportResponsesToExcel(kind, sem, subjectCols, responses){
  if(subjectCols.length===0 || responses.length===0){ toast('Nothing to export'); return; }
  const flatCos = flattenCoColumns(subjectCols);
  const headerRow1 = ['Identity', ...flatCos.map(fc=>fc.course.code)];
  const headerRow2 = ['', ...flatCos.map(fc=>fc.co?fc.co.code:'')];

async function renderResults(){
  const c = document.getElementById('content');
  const sem = state.sub.resSem || 1;
  state.sub.resSem = sem;
  c.innerHTML = `
    <div class="crumb">Academics</div>
    <div class="page-head"><div><h2>Result Sheets</h2><p class="sub">Upload the mark sheet for each semester separately (.xlsx or .csv).</p></div></div>
    <div class="tabs">
      ${[1,2,3,4,5,6].map(n=>`<button class="tab-btn ${sem===n?'active':''}" data-sem="${n}">Sem ${n}</button>`).join('')}
    </div>
    <div id="res-body"></div>
  `;
  c.querySelectorAll('[data-sem]').forEach(b=>b.addEventListener('click', ()=>{ state.sub.resSem=parseInt(b.dataset.sem,10); renderResults(); }));

  const stored = await sGet('result_sem:'+sem);
  const body = document.getElementById('res-body');
  body.innerHTML = `
    <div class="card">
      <h3>Semester ${sem} Result Sheet</h3>
      <div class="file-drop">
        <input type="file" id="res-file" accept=".xlsx,.xls,.csv" />
        <p style="margin-top:8px;">Choose an .xlsx or .csv file for Semester ${sem}</p>
      </div>
      ${stored ? `<p class="small-note">Currently stored: <b>${stored.filename}</b> — uploaded ${new Date(stored.uploadedAt).toLocaleString()}, ${stored.rows.length} rows.</p>` : '<p class="small-note">Nothing uploaded yet for this semester.</p>'}
    </div>
    ${stored ? `<div class="card"><h3>Preview</h3><div class="table-wrap" style="max-height:600px;overflow-y:auto;">${renderSheetTable(stored)}</div></div>` : ''}
  `;
  document.getElementById('res-file').addEventListener('change', handleResultFile);

  async function handleResultFile(e){
    const file = e.target.files[0];
    if(!file) return;
    const data = await file.arrayBuffer();
    const wb = XLSX.read(data, {type:'array'});
    const ws = wb.Sheets[wb.SheetNames[0]];
    const json = XLSX.utils.sheet_to_json(ws, {header:1, defval:''});

    // Many mark sheets use a 2-row header: row 1 has merged group labels like "INTERNAL" /
    // "EXTERNAL" (blank in the merged-over cells), row 2 has the actual per-subject
    // sub-headers (e.g. subject codes). Detect this by checking whether row 2 looks like
    // header text (not numeric marks) — if so, forward-fill row 1's blanks across the
    // merge and combine "row2 row1" into one header per column, e.g. "BMS Internal".
    const row0 = json[0] || [];
    const row1 = json[1] || [];
    const nonEmpty1 = row1.filter(v=>String(v).trim()!=='');
    const numericCount1 = nonEmpty1.filter(v=>!isNaN(parseFloat(v)) && v!=='').length;
    const row1LooksLikeHeader = nonEmpty1.length>0 && (numericCount1/nonEmpty1.length) < 0.5;

    let headers, dataStart;
    if(row1LooksLikeHeader){
      let lastVal = '';
      const filled = row0.map(v=>{ const s=String(v||'').trim(); if(s){ lastVal=s; return s; } return lastVal; });
      headers = row1.map((v,i)=>{
        const group = filled[i] || '';
        const sub = String(v||'').trim();
        if(group && sub && group.toLowerCase()!==sub.toLowerCase()) return `${sub} ${group}`;
        return sub || group;
      });
      dataStart = 2;
    } else {
      headers = row0;
      dataStart = 1;
    }

    const rows = json.slice(dataStart).filter(r=>r.some(cell=>cell!==''));
    const payload = {filename:file.name, headers, rows, uploadedAt:new Date().toISOString()};
    await sSet('result_sem:'+sem, payload);
    toast('Result sheet uploaded for Sem '+sem);
    renderResults();
  }
}

function renderSheetTable(stored){
  const headRow = `<tr>${stored.headers.map(h=>`<th>${h}</th>`).join('')}</tr>`;
  const bodyRows = stored.rows.map(r=>`<tr>${stored.headers.map((h,i)=>`<td>${r[i]!==undefined?r[i]:''}</td>`).join('')}</tr>`).join('');
  return `<table>${headRow}${bodyRows}</table><p class="small-note">Showing all ${stored.rows.length} row(s).</p>`;
}

/* ======================================================================
   ADMIN/TEACHER: CO-PO-PSO MAPPING
   ====================================================================== */
async function renderCopo(){
  await loadCoursesIfNeeded();
  const c = document.getElementById('content');
  if(state.courses.length===0){ c.innerHTML = `<div class="crumb">Academics</div><h2>CO-PO-PSO Mapping</h2><div class="empty">Add courses first.</div>`; return; }
  const selId = state.sub.copoCourseId || state.courses[0].id;
  state.sub.copoCourseId = selId;
  const cos = (await sGet('ces_params:'+selId)) || [];
  const pos = (await sGet('program_params')) || [];
  const mapping = (await sGet('copo:'+selId)) || {};

  c.innerHTML = `
    <div class="crumb">Academics</div>
    <div class="page-head"><div><h2>CO&ndash;PO&ndash;PSO Mapping</h2><p class="sub">Enter mapping strength (0&ndash;3) for each Course Outcome against each PO/PSO, or upload a file.</p></div></div>
    <div class="card">
      <div class="field" style="max-width:340px;"><label>Course</label>
        <select id="copo-course-select">${state.courses.map(co=>`<option value="${co.id}" ${co.id===selId?'selected':''}>${co.code} — ${co.name}</option>`).join('')}</select>
      </div>
      <div class="file-drop" style="margin-bottom:14px;">
        <input type="file" id="copo-file" accept=".xlsx,.xls,.csv" />
        <p style="margin-top:8px;">Optional: upload a CO×PO matrix file (first row = PO/PSO codes, first column = CO codes)</p>
      </div>
      ${(cos.length===0||pos.length===0) ? '<div class="empty">Define this course\'s COs (Survey Parameters) and the shared PO/PSO set first — the mapping grid and file upload need both of these before they can appear.</div>' : renderCopoGrid(cos,pos,mapping)}
    </div>
  `;
  document.getElementById('copo-course-select').addEventListener('change', e=>{ state.sub.copoCourseId=e.target.value; renderCopo(); });

  const fileInput = document.getElementById('copo-file');
  if(fileInput) fileInput.addEventListener('change', async (e)=>{
    const file = e.target.files[0]; if(!file) return;
    if(cos.length===0 || pos.length===0){
      toast('Define the course\'s COs and the shared PO/PSO set first, then upload the mapping file.');
      fileInput.value = '';
      return;
    }
    try{
      const data = await file.arrayBuffer();
      const wb = XLSX.read(data, {type:'array'});
      const ws = wb.Sheets[wb.SheetNames[0]];
      const json = XLSX.utils.sheet_to_json(ws, {header:1, defval:''});
      if(json.length<2){ toast('The file appears to be empty — nothing to load'); return; }
      const norm = v => String(v==null?'':v).trim().toLowerCase();
      const fileHeaders = (json[0]||[]).slice(1).map(norm);
      const newMapping = {};
      let matchedRows = 0, matchedCells = 0;
      json.slice(1).forEach(row=>{
        if(row.every(cell=>cell==='')) return;
        const coCode = norm(row[0]);
        const co = cos.find(x=>norm(x.code)===coCode);
        if(!co) return;
        matchedRows++;
        newMapping[co.id] = {};
        pos.forEach(p=>{
          const colIdx = fileHeaders.indexOf(norm(p.code));
          const raw = colIdx>=0 ? row[colIdx+1] : 0;
          const val = parseInt(raw,10)||0;
          newMapping[co.id][p.id] = val;
          if(val>0) matchedCells++;
        });
      });
      if(matchedRows===0){
        toast('No rows matched a CO code for this course — check the first column of your file matches the CO codes exactly (e.g. '+(cos[0]?cos[0].code:'CO1')+').');
        fileInput.value = '';
        return;
      }
      cos.forEach(co=>{ if(!newMapping[co.id]) newMapping[co.id] = mapping[co.id] || {}; });
      await sSet('copo:'+selId, newMapping);
      toast(`Mapping file loaded — ${matchedRows} CO row(s), ${matchedCells} non-zero cell(s).`);
      renderCopo();
    }catch(err){
      console.error('CO-PO file load failed', err);
      toast('Could not read that file — please check it is a valid .xlsx/.xls/.csv');
    }
  });

  const saveBtn = document.getElementById('copo-save');
  if(saveBtn) saveBtn.addEventListener('click', async ()=>{
    const newMapping = {};
    cos.forEach(co=>{
      newMapping[co.id] = {};
      pos.forEach(p=>{
        const inp = document.querySelector(`[data-cell="${co.id}_${p.id}"]`);
        newMapping[co.id][p.id] = inp ? (parseInt(inp.value,10)||0) : 0;
      });
    });
    await sSet('copo:'+selId, newMapping);
    toast('Mapping saved');
  });

  const clearBtn = document.getElementById('copo-clear');
  if(clearBtn) clearBtn.addEventListener('click', async ()=>{
    if(!confirm('Clear the entire CO-PO-PSO mapping for this course? This cannot be undone.')) return;
    await sDelete('copo:'+selId);
    toast('Mapping cleared');
    renderCopo();
  });
}

function renderCopoGrid(cos,pos,mapping){
  const hasMapping = Object.keys(mapping||{}).some(k=>mapping[k] && Object.values(mapping[k]).some(v=>v>0));
  const head = `<tr><th>CO \\ PO</th>${pos.map(p=>`<th>${p.code}</th>`).join('')}</tr>`;
  const rows = cos.map(co=>{
    const cells = pos.map(p=>{
      const raw = mapping[co.id] && mapping[co.id][p.id] !== undefined ? mapping[co.id][p.id] : 0;
      const v = raw>0 ? raw : '';
      return `<td><input class="matrix-input" type="number" min="0" max="3" value="${v}" placeholder="-" data-cell="${co.id}_${p.id}"/></td>`;
    }).join('');
    return `<tr><td><b>${co.code}</b></td>${cells}</tr>`;
  }).join('');
  return `<div class="table-wrap"><table>${head}${rows}</table></div>
  <p class="small-note">Scale: 1 = low, 2 = medium, 3 = high (substantial) correlation. Leave a cell blank ("-") for no mapping. Edit any cell and click Save — the values shown already reflect anything previously entered or uploaded.</p>
  <button class="btn btn-primary" id="copo-save" style="margin-top:8px;">Save Mapping</button>
  ${hasMapping ? `<button class="btn btn-danger" id="copo-clear" style="margin-top:8px;margin-left:8px;">Delete / Clear Mapping</button>` : ''}`;
}




/* ======================================================================
   ADMIN/TEACHER: ATTAINMENT CALCULATION
   Two-step workflow:
   1) "Result Sheet Setup" — done once per semester. Every subject found in that
      semester's Result Sheet is listed; tag each subject's Internal (FA-TH/FA-PR/SLA)
      and External (SA-TH/SA-PR) columns with their max marks. Saved per (semester,
      subject) — NOT per course — so it's read automatically forever after and is
      never re-asked when picking a different course.
   2) "Calculate Attainment" — pick a course, see Direct/Indirect/Final/CO-PO/PO-PSO
      Attainment computed from what was set up in step 1.

   Formulas:
   - Level from % of students ≥ benchmark: below benchmark → Level 1 (flat); at/above
     benchmark → 1/2/3 (by 60/70/80% bands) plus the tenths digit of the percentage as
     a decimal, e.g. 60.61% → Level 1.06. Level is capped at 3 (no decimal added once
     the top band is reached).
   - Direct Attainment = 0.8 × External Level + 0.2 × Internal Level
   - Indirect Attainment = average CO rating from the Course Exit (student) Survey,
     computed per-CO, then averaged across the course's COs.
   - Final Course Attainment = 0.8 × Direct + 0.2 × Indirect
   - CO→PO/PSO Attainment = Σ(CO Attainment × mapping strength) / (3 × COs mapped to
     that PO) — cells with no mapping strength are shown as "-", never as 0.
   - Section 6 "PO / PSO Attainment" is shown only for Final Year (Semester 6) courses.
   ====================================================================== */

// Known course code → Result Sheet abbreviation, so column matching works even when the
// course name doesn't carry a "(ABBR)" suffix. Falls back to name-parsing / course code
// if a code isn't listed here — add more pairs below as needed.
const COURSE_ABBR_BY_CODE = {
  '311302':'BMS', '311301':'BSC', '311303':'English', '311008':'EGE', '311002':'WPC',
  '311001':'ICT', '311003':'YAM',
  '312301':'AMS', '312302':'BEE', '312303':'PIC', '312001':'BLP', '312004':'WPD',
  '312002':'PCO', '312003':'SFS',
  '313301':'DSU', '313302':'DMS', '313303':'DTE', '313304':'OOP', '313001':'CGR', '313002':'EIC',
  '314301':'EST', '314317':'JPR', '314318':'DCN', '314321':'MIC', '314001':'PWP', '314005':'UID',
  '315319':'OSY', '315323':'STE', '315002':'ENDS', '315003':'SPI', '315004':'ITR',
  '315321':'ACN', '315301':'MAN',
  '316313':'ETI', '316314':'SFT', '316005':'CSS', '316006':'MAD', '316004':'CPE', '316317':'NIS',
};

function extractComponentLabel(header){
  const h = String(header||'').toLowerCase().replace(/[\s_]+/g,'-');
  if(/fa-?th/.test(h)) return 'FA-TH';
  if(/fa-?pr/.test(h)) return 'FA-PR';
  if(/\bsla\b/.test(h)) return 'SLA';
  if(/sa-?th/.test(h)) return 'SA-TH';
  if(/sa-?pr/.test(h)) return 'SA-PR';
  return null;
}
function guessComponentRole(header){
  const label = extractComponentLabel(header);
  if(label) return ['FA-TH','FA-PR','SLA'].includes(label) ? 'internal' : 'external';
  const h = String(header||'').toLowerCase().replace(/[\s_]+/g,'-');
  if(/\b(fa|internal|ia|cie)\b/.test(h)) return 'internal';
  if(/\b(sa|ese|external|university|univ)\b/.test(h)) return 'external';
  return 'ignore';
}

// Read the actual subject "prefix" straight out of the Result Sheet's own column names
// (e.g. "ASM- FA-TH" → "ASM"). Tier 1: strict match against a recognizable component
// suffix. Fallback (per-column, not per-sheet): if a given header doesn't match that
// pattern, split it on its first separator and use that as a generic prefix instead —
// this handles sheets where some subjects use the FA-TH/SA-TH convention and others don't,
// so every subject in the sheet gets listed, not just the ones matching one convention.
function extractHeaderPrefixStrict(header){
  const raw = String(header||'');
  const m = raw.match(/^(.*?)[\s_-]*\b(fa-?th|fa-?pr|sla|sa-?th|sa-?pr)\b/i);
  if(!m) return null;
  return m[1].replace(/[\s_-]+$/,'').trim();
}
function extractHeaderPrefixGeneric(header){
  const raw = String(header||'').trim();
  const m = raw.match(/^([A-Za-z0-9]+)[\s_-]+(.+)$/);
  if(!m) return null;
  if(/^(enroll|enrollment|roll|name|student|sr|no|id|sl)$/i.test(m[1])) return null; // skip identity columns
  return m[1].trim();
}
function extractHeaderPrefix(header){
  return extractHeaderPrefixStrict(header) || extractHeaderPrefixGeneric(header);
}
function extractSheetPrefixes(resultSheet){
  const set = new Set();
  resultSheet.headers.forEach(h=>{ const p = extractHeaderPrefix(h); if(p) set.add(p); });
  return Array.from(set).sort();
}
function columnsForPrefix(resultSheet, prefix){
  return resultSheet.headers.map((h,i)=>i).filter(i=>extractHeaderPrefix(resultSheet.headers[i])===prefix);
}
function cssSafe(s){ return String(s).replace(/[^A-Za-z0-9]/g,'_'); }

function levelFromPct(pct, benchmark){
  benchmark = benchmark==null ? 50 : benchmark;
  if(pct < benchmark) return 1;
  if(pct >= 80) return 3; // Level is capped at 3 — no decimal added once the top band is reached
  if(pct >= 70){
    const offset = Math.round(((pct-70)/10)*100)/100;
    return Math.round((2+offset)*100)/100;
  }
  if(pct >= 60){
    const offset = Math.round(((pct-60)/10)*100)/100;
    return Math.round((1+offset)*100)/100;
  }
  return 1; // above benchmark but below the 60% band start — flat Level 1
}
function levelClass(l){ return 'lvl-'+Math.max(0,Math.min(3,Math.floor(l))); }
function mapCell(v){ return (v && v>0) ? v : '-'; }

function computeComponentsFromResultSheet(resultSheet, roles, benchmark){
  const tagged = Object.keys(roles||{});
  const componentResults = tagged.map(i=>{
    const {role, max, header} = roles[i];
    let appeared=0, above=0;
    resultSheet.rows.forEach(row=>{
      const raw = parseFloat(row[i]);
      if(!isNaN(raw)){ appeared++; if((raw/max*100)>=benchmark) above++; }
    });
    const pct = appeared ? (above/appeared*100) : 0;
    return {idx:i, header, role, max, appeared, above, pct, level: levelFromPct(pct, benchmark)};
  });
  const intComps = componentResults.filter(x=>x.role==='internal');
  const extComps = componentResults.filter(x=>x.role==='external');
  const intLevel = intComps.length ? (intComps.reduce((a,x)=>a+x.level,0)/intComps.length) : 0;
  const extLevel = extComps.length ? (extComps.reduce((a,x)=>a+x.level,0)/extComps.length) : 0;
  return {componentResults, intComps, extComps, intLevel, extLevel};
}

/* ---------- STEP 2: CALCULATE ATTAINMENT (by course) ---------- */
async function resolveCoursePrefix(course, sheetPrefixes){
  const prefixMapStore = (await sGet('attainment_prefix_map')) || {};
  const norm = s => String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  const anagramKey = s => norm(s).split('').sort().join('');
  let confirmed = prefixMapStore[course.id] && sheetPrefixes.includes(prefixMapStore[course.id]) ? prefixMapStore[course.id] : null;
  const abbrMatch = String(course.name||'').match(/\(([A-Za-z0-9]+)\)\s*$/);
  const codeGuess = COURSE_ABBR_BY_CODE[course.code] || (abbrMatch ? abbrMatch[1] : null);
  let suggested = null;
  if(!confirmed && codeGuess && sheetPrefixes.length){
    suggested = sheetPrefixes.find(p=>norm(p)===norm(codeGuess)) || null;
    if(suggested){
      confirmed = suggested;
      prefixMapStore[course.id] = suggested;
      await sSet('attainment_prefix_map', prefixMapStore);
    } else {
      suggested = sheetPrefixes.find(p=>anagramKey(p)===anagramKey(codeGuess)) || null;
    }
  }
  return {confirmed, suggested, prefixMapStore};
}

// Gathers everything needed to compute a course's attainment — shared by the "Calculate
// Attainment" tab and the "CO-PO Attainment Calculation" tab so both stay in sync.
async function getAttainmentContext(course){
  const isFinalYear = course.semester===6;
  const cos = (await sGet('ces_params:'+course.id)) || [];
  const mapping = (await sGet('copo:'+course.id)) || {};
  const pos = (await sGet('program_params')) || [];
  const resultSheet = await sGet('result_sem:'+course.semester);
  const benchmark = state.sub.attBenchmark || 60;

  const studentResponses = (await sGet('co_responses:student:'+course.semester)) || [];
  const coIndirect = {};
  cos.forEach(co=>{
    const vals = studentResponses.map(r=>r.ratings[course.id+'::'+co.id]).filter(v=>v!=null);
    coIndirect[co.id] = {count: vals.length, avg: vals.length ? (vals.reduce((a,b)=>a+b,0)/vals.length) : null};
  });
  const overallVals = cos.map(co=>coIndirect[co.id].avg).filter(v=>v!=null);
  const courseIndirect = {count: studentResponses.length, avg: overallVals.length ? (overallVals.reduce((a,b)=>a+b,0)/overallVals.length) : null};

  let programByPo = {};
  if(isFinalYear && pos.length){
    const poKinds = ['program','parent','alumni','industry'];
    const poByStakeholder = {};
    for(const k of poKinds){ poByStakeholder[k] = (await sGet('po_responses:'+k)) || []; }
    pos.forEach(p=>{
      const groupAvgs = poKinds.map(k=>{
        const vals = poByStakeholder[k].map(r=>r.ratings[p.id]).filter(v=>v!=null);
        return vals.length ? (vals.reduce((a,b)=>a+b,0)/vals.length) : null;
      }).filter(v=>v!=null);
      programByPo[p.id] = { avg: groupAvgs.length ? (groupAvgs.reduce((a,b)=>a+b,0)/groupAvgs.length) : null };
    });
  }

  let auto = null, confirmed = null, suggested = null, sheetPrefixes = [];
  if(resultSheet){
    sheetPrefixes = extractSheetPrefixes(resultSheet);
    const res = await resolveCoursePrefix(course, sheetPrefixes);
    confirmed = res.confirmed; suggested = res.suggested;
    if(confirmed){
      const saved = await sGet('attainment_colmap_by_prefix:'+course.semester+':'+confirmed);
      if(saved && saved.roles && Object.keys(saved.roles).length>0){
        auto = computeComponentsFromResultSheet(resultSheet, saved.roles, benchmark);
      }
    }
  }

  const inputs = {
    intLevel: auto?auto.intLevel:0, extLevel: auto?auto.extLevel:0,
    hasInternal: !!(auto && auto.intComps.length>0), hasExternal: !!(auto && auto.extComps.length>0)
  };

  return {isFinalYear, cos, mapping, pos, resultSheet, benchmark, coIndirect, courseIndirect, programByPo, auto, confirmed, suggested, sheetPrefixes, inputs};
}

// "C" + semester + running index of this course within that semester (e.g. C101, C102, C601)
function courseSerial(course){
  const inSem = state.courses.filter(c=>c.semester===course.semester);
  const idx = inSem.findIndex(c=>c.id===course.id);
  return 'C'+course.semester+String(idx+1).padStart(2,'0');
}
async function courseAbbrForDisplay(course){
  const prefixMapStore = (await sGet('attainment_prefix_map')) || {};
  if(prefixMapStore[course.id]) return prefixMapStore[course.id];
  const abbrMatch = String(course.name||'').match(/\(([A-Za-z0-9]+)\)\s*$/);
  return COURSE_ABBR_BY_CODE[course.code] || (abbrMatch ? abbrMatch[1] : course.code);
}

// COPO Attainment Calculation = (Attainment of relevant COs × Actual mapping strength) /
// (Maximum mapping strength). Simplified per the institute's worked example: for each PO/PSO,
// average the mapping strength across only the COs that are actually mapped to it (skip "-"),
// then PO = (Direct Attainment × that average) / 3. A PO with no mapped COs shows "-".
function computeCopoAttainment(direct, cos, pos, mapping){
  return pos.map(p=>{
    const vals = cos.map(co=> mapping[co.id] ? (mapping[co.id][p.id]||0) : 0).filter(v=>v>0);
    if(vals.length===0) return {code:p.code, text:p.text, avgStrength:null, value:null};
    const avgStrength = vals.reduce((a,b)=>a+b,0)/vals.length;
    const value = (direct*avgStrength)/3;
    return {code:p.code, text:p.text, avgStrength, value};
  });
}

/* ---------- STEP 5: CONSOLIDATED REPORT (all subjects of an exam session — Winter/Summer) ---------- */
const EXAM_SESSION_SEMESTERS = { winter:[1,3,5], summer:[2,4,6] };
const SEMESTER_ORDINAL = {1:'First',2:'Second',3:'Third',4:'Fourth',5:'Fifth',6:'Sixth'};

async function buildConsolidatedRows(semesters){
  const targets = (await sGet('course_targets')) || {};
  const pos = (await sGet('program_params')) || [];
  const prefixMapStore = (await sGet('attainment_prefix_map')) || {};
  const benchmark = state.sub.attBenchmark || 60;
  const norm = s => String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'');

  // PO indirect (survey-based) is the same for every course — fetch once, only if needed.
  let programByPo = {};
  if(semesters.includes(6) && pos.length){
    const poKinds = ['program','parent','alumni','industry'];
    const poByStakeholder = {};
    for(const k of poKinds){ poByStakeholder[k] = (await sGet('po_responses:'+k)) || []; }
    pos.forEach(p=>{
      const groupAvgs = poKinds.map(k=>{
        const vals = poByStakeholder[k].map(r=>r.ratings[p.id]).filter(v=>v!=null);
        return vals.length ? (vals.reduce((a,b)=>a+b,0)/vals.length) : null;
      }).filter(v=>v!=null);
      programByPo[p.id] = { avg: groupAvgs.length ? (groupAvgs.reduce((a,b)=>a+b,0)/groupAvgs.length) : null };
    });
  }

  const bySem = {};
  for(const sem of semesters){
    const coursesInSem = state.courses.filter(c=>c.semester===sem);
    // Result Sheet, its subject list, and the Course Exit Survey responses are the same for
    // every course in this semester — fetch each of these ONCE per semester, not per course.
    const resultSheet = await sGet('result_sem:'+sem);
    const sheetPrefixes = resultSheet ? extractSheetPrefixes(resultSheet) : [];
    const studentResponses = (await sGet('co_responses:student:'+sem)) || [];
    const colmapCache = {};

    const rows = [];
    for(const course of coursesInSem){
      const cos = (await sGet('ces_params:'+course.id)) || [];
      const mapping = (await sGet('copo:'+course.id)) || {};

      const coIndirect = {};
      cos.forEach(co=>{
        const vals = studentResponses.map(r=>r.ratings[course.id+'::'+co.id]).filter(v=>v!=null);
        coIndirect[co.id] = {count: vals.length, avg: vals.length ? (vals.reduce((a,b)=>a+b,0)/vals.length) : null};
      });
      const overallVals = cos.map(co=>coIndirect[co.id].avg).filter(v=>v!=null);
      const courseIndirect = {count: studentResponses.length, avg: overallVals.length ? (overallVals.reduce((a,b)=>a+b,0)/overallVals.length) : null};

      // Resolve the course's Result Sheet subject WITHOUT persisting writes here (bulk read
      // path) — uses the already-confirmed link if present, else a quick exact-name guess.
      let confirmed = prefixMapStore[course.id] && sheetPrefixes.includes(prefixMapStore[course.id]) ? prefixMapStore[course.id] : null;
      if(!confirmed && resultSheet && sheetPrefixes.length){
        const abbrMatch = String(course.name||'').match(/\(([A-Za-z0-9]+)\)\s*$/);
        const codeGuess = COURSE_ABBR_BY_CODE[course.code] || (abbrMatch ? abbrMatch[1] : null);
        if(codeGuess) confirmed = sheetPrefixes.find(p=>norm(p)===norm(codeGuess)) || null;
      }
      let auto = null;
      if(confirmed){
        if(!(confirmed in colmapCache)) colmapCache[confirmed] = await sGet('attainment_colmap_by_prefix:'+sem+':'+confirmed);
        const saved = colmapCache[confirmed];
        if(saved && saved.roles && Object.keys(saved.roles).length>0){
          auto = computeComponentsFromResultSheet(resultSheet, saved.roles, benchmark);
        }
      }

      const inputs = {
        intLevel: auto?auto.intLevel:0, extLevel: auto?auto.extLevel:0,
        hasInternal: !!(auto && auto.intComps.length>0), hasExternal: !!(auto && auto.extComps.length>0)
      };
      const {final} = computeAttainment(inputs, cos, coIndirect, courseIndirect, mapping, pos, programByPo);

      const abbr = confirmed || COURSE_ABBR_BY_CODE[course.code] || course.code;
      const serial = courseSerial(course);
      const target = targets[course.code]!=null ? targets[course.code] : null;
      const deviation = target!=null ? Number((final-target).toFixed(2)) : null;
      const achieved = target!=null ? (final>=target ? 'Achieved' : 'Not achieved') : '—';
      rows.push({serial, abbr, code:course.code, target, coAttainment:Number(final.toFixed(2)), deviation, achieved, resultSheetMissing: !resultSheet, notConfirmed: !confirmed});
    }
    bySem[sem] = rows;
  }
  return bySem;
}

      ${semesters.map(sem=>{
