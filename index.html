function exportConsolidatedPDF(session, year, dept, semesters, bySem){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({orientation:'landscape'});
  let y = 16;
  const pageWidth = doc.internal.pageSize.getWidth();

  doc.setFontSize(20); doc.setFont(undefined,'bold');
  doc.text(dept, pageWidth/2, y, {align:'center'}); y+=9;
  doc.setFontSize(13);
  doc.text(`CO ATTAINMENT FOR EXAM - ${session.toUpperCase()}-20${String(year||'').replace(/^20/,'')}`, pageWidth/2, y, {align:'center'}); y+=8;
  doc.text('CO ATTAINMENT', pageWidth/2, y, {align:'center'}); y+=8;

  doc.setFontSize(12); doc.setFont(undefined,'normal');
  const paraLines = doc.splitTextToSize(consolidatedParagraph(session), pageWidth-28);
  doc.text(paraLines, 14, y); y += paraLines.length*4.2 + 4;

  semesters.forEach(sem=>{
    const rows = bySem[sem]||[];
    if(y>170){ doc.addPage(); y=16; }
    doc.setFontSize(13); doc.setFont(undefined,'bold');
    doc.text(SEMESTER_ORDINAL[sem]+' Semester', pageWidth/2, y, {align:'center'}); y+=5;
    doc.autoTable({
      startY:y,
      head:[['Course','Course Abv','Course Code','Target','CO Attainment','Deviation','Achived / not achieved','Subject Teacher','Signature']],
      body: rows.map(r=>[r.serial, r.abbr, r.code, r.target!=null?r.target.toFixed(2):'', r.coAttainment.toFixed(2), r.deviation!=null?r.deviation.toFixed(2):'', r.achieved, '', '']),
      styles:{fontSize:12}, headStyles:{fillColor:[18,42,82]},
      margin:{left:14,right:14}
    });
    y = doc.lastAutoTable.finalY + 8;
  });

  if(y>180){ doc.addPage(); y=16; }
  doc.setFontSize(12); doc.setFont(undefined,'bold');
  doc.text('Academic coordinator', 14, y);
  doc.text('Principal', pageWidth-40, y);

  doc.save(`CO_Attainment_${session}_20${String(year||'').replace(/^20/,'')}.pdf`);
}

  });

  const changeSubjectBtn = document.getElementById('att-change-subject');
  if(changeSubjectBtn) changeSubjectBtn.addEventListener('click', async ()=>{
    if(!confirm('Change which Result Sheet subject this course reads from?')) return;
    const prefixMapStore = (await sGet('attainment_prefix_map')) || {};
    delete prefixMapStore[selId];
    await sSet('attainment_prefix_map', prefixMapStore);
    renderAttainmentCalcTab();
  });

  if(auto){
    const holder = document.getElementById('att-component-detail');
    holder.innerHTML = `<div class="table-wrap"><table>
      <tr><th>Column</th><th>Group</th><th>Appeared</th><th>≥ Benchmark</th><th>%</th><th>Level</th></tr>
      ${auto.componentResults.map(x=>`<tr><td>${x.header}</td><td>${x.role==='internal'?'Internal':'External'}</td><td>${x.appeared}</td><td>${x.above}</td><td>${x.pct.toFixed(1)}%</td><td><span class="badge-level ${levelClass(x.level)}">${x.level.toFixed(2)}</span></td></tr>`).join('')}
    </table></div>
    <p style="margin-top:8px;"><b>Internal Level</b> = ${auto.intLevel.toFixed(2)} &middot; <b>External Level</b> = ${auto.extLevel.toFixed(2)}</p>`;
  }

  const inputs = {
    intLevel: auto?auto.intLevel:0, extLevel: auto?auto.extLevel:0,
    hasInternal: !!(auto && auto.intComps.length>0), hasExternal: !!(auto && auto.extComps.length>0)
  };
  renderAttainmentResults(course, inputs, cos, coIndirect, courseIndirect, mapping, pos, programByPo, isFinalYear);

  document.getElementById('att-export')?.addEventListener('click', async ()=>{
    const abbr = await courseAbbrForDisplay(course);
    const serial = courseSerial(course);
    exportAttainmentSheet(course, inputs, cos, coIndirect, courseIndirect, mapping, pos, programByPo, auto ? auto.componentResults : [], isFinalYear, abbr, serial);
  });
  document.getElementById('att-export-pdf')?.addEventListener('click', async ()=>{
    const abbr = await courseAbbrForDisplay(course);
    const serial = courseSerial(course);
    exportAttainmentPDF(course, inputs, cos, coIndirect, courseIndirect, mapping, pos, programByPo, auto ? auto.componentResults : [], isFinalYear, abbr, serial);
  });
}

function computeAttainment(inputs, cos, coIndirect, courseIndirect, mapping, pos, programByPo){
  const hasInternal = inputs.hasInternal!==false; // default true for backward-compat callers
  const hasExternal = inputs.hasExternal!==false;
  // If a subject has no Internal (or no External) component at all, don't treat the missing
  // side as 0 — treat it as the baseline Level 1 and still apply the full 0.8/0.2 formula.
  // e.g. External absent, Internal=3.0 → 0.8×1 + 0.2×3.0 = 1.40
  const intLevel = hasInternal ? (inputs.intLevel||0) : 1;
  const extLevel = hasExternal ? (inputs.extLevel||0) : 1;
  const direct = 0.8*extLevel + 0.2*intLevel;

  const indirect = courseIndirect.avg!=null ? courseIndirect.avg : 0;
  const final = 0.8*direct + 0.2*indirect;

  const coAttainment = {};
  cos.forEach(co=>{
    const ind = coIndirect[co.id] && coIndirect[co.id].avg!=null ? coIndirect[co.id].avg : indirect;
    coAttainment[co.id] = 0.8*direct + 0.2*ind;
  });

  const poRows = pos.map(p=>{
    let weighted = 0, mappedCount = 0;
    cos.forEach(co=>{
      const strength = mapping[co.id] ? (mapping[co.id][p.id]||0) : 0;
      if(strength>0){ weighted += coAttainment[co.id]*strength; mappedCount++; }
    });
    const directPo = mappedCount ? weighted/(3*mappedCount) : 0;
    const indirectPo = programByPo[p.id] && programByPo[p.id].avg!=null ? programByPo[p.id].avg : null;
    const value = indirectPo!=null ? (0.8*directPo + 0.2*indirectPo) : directPo;
    return {code:p.code, text:p.text, directPo, indirectPo, value, mappedCount};
  });

  return {intLevel, extLevel, direct, indirect, final, coAttainment, poRows};
}

function renderAttainmentResults(course, inputs, cos, coIndirect, courseIndirect, mapping, pos, programByPo, isFinalYear){
  const box = document.getElementById('att-results');
  const {intLevel, extLevel, direct, indirect, final, coAttainment, poRows} = computeAttainment(inputs, cos, coIndirect, courseIndirect, mapping, pos, programByPo);
  const hasInternal = inputs.hasInternal!==false;
  const hasExternal = inputs.hasExternal!==false;
  const directFormula = `= 0.8 × ${extLevel.toFixed(2)}${hasExternal?'':' (assumed, no External component)'} + 0.2 × ${intLevel.toFixed(2)}${hasInternal?'':' (assumed, no Internal component)'} = <b>${direct.toFixed(2)}</b>`;

  box.innerHTML = `
    <div class="card">
      <h3>2 &middot; Direct Attainment</h3>
      <div class="stat-grid">
        <div class="stat-box"><div class="v"><span class="badge-level ${levelClass(intLevel)}">${intLevel.toFixed(2)}</span></div><div class="l">Internal Level${hasInternal?'':' (assumed — not applicable)'}</div></div>
        <div class="stat-box"><div class="v"><span class="badge-level ${levelClass(extLevel)}">${extLevel.toFixed(2)}</span></div><div class="l">External Level${hasExternal?'':' (assumed — not applicable)'}</div></div>
      </div>
      <p><b>Direct Attainment</b> ${directFormula}</p>
    </div>
    <div class="card">
      <h3>3 &middot; Indirect Attainment (Course Exit Survey, per CO)</h3>
      ${cos.length===0 ? '<div class="empty">No Course Outcomes defined for this course.</div>' : `
      <div class="table-wrap"><table>
        <tr><th>CO</th><th>Statement</th><th>Responses</th><th>Average Rating</th></tr>
        ${cos.map(co=>{
          const ind = coIndirect[co.id];
          return `<tr><td><b>${co.code}</b></td><td>${co.text||''}</td><td>${ind.count}</td><td>${ind.avg!=null?ind.avg.toFixed(2)+' / 3':'<span class="small-note">no responses yet</span>'}</td></tr>`;
        }).join('')}
      </table></div>`}
      <p style="margin-top:10px;"><b>Indirect Attainment</b> (average of CO ratings) = <b>${indirect.toFixed(2)}</b> / 3</p>
    </div>
    <div class="card">
      <h3>4 &middot; Final Course Attainment</h3>
      <p><b>Final Attainment</b> = 0.8 × ${direct.toFixed(2)} + 0.2 × ${indirect.toFixed(2)} = <span class="badge-level ${levelClass(final)}" style="font-size:16px;">${final.toFixed(2)}</span></p>
      ${cos.length>0 ? `<div class="table-wrap" style="margin-top:10px;"><table>
        <tr><th>CO</th><th>Attainment</th></tr>
        ${cos.map(co=>`<tr><td><b>${co.code}</b></td><td>${coAttainment[co.id].toFixed(2)}</td></tr>`).join('')}
      </table></div>` : ''}
    </div>
    <div class="card">
      <h3>5 &middot; CO&ndash;PO/PSO Mapping</h3>
      <p class="small-note">(Attainment of relevant COs × Actual mapping strength) / (Maximum mapping strength). Unmapped cells shown as "-".</p>
      ${(cos.length===0||pos.length===0) ? '<div class="empty">Define COs and the PO/PSO set first.</div>' : `
      <div class="table-wrap"><table>
        <tr><th>CO \\ PO</th>${pos.map(p=>`<th>${p.code}</th>`).join('')}</tr>
        ${cos.map(co=>`<tr><td><b>${co.code}</b></td>${pos.map(p=>`<td style="text-align:center;">${mapCell(mapping[co.id]?mapping[co.id][p.id]:0)}</td>`).join('')}</tr>`).join('')}
      </table></div>`}
    </div>
    ${isFinalYear ? `
    <div class="card">
      <h3>6 &middot; PO / PSO Attainment <span class="small-note">(Final Year courses only)</span></h3>
      <p class="small-note">CO→PO Direct = Σ(CO Attainment × mapping strength) ÷ (3 × COs mapped to that PO). PO Indirect = average of the Program Exit, Parent, Alumni and Industry surveys' direct PO/PSO ratings.</p>
      ${pos.length===0 ? '<div class="empty">Define the PO/PSO parameter set first (Survey Parameters).</div>' : `
      <div class="table-wrap"><table>
        <tr><th>Code</th><th>Statement</th><th>Direct (from COs)</th><th>Indirect (Surveys)</th><th>Attainment</th></tr>
        ${poRows.map(r=>`<tr><td><b>${r.code}</b></td><td>${r.text||''}</td><td>${r.mappedCount?r.directPo.toFixed(2):'<span class="small-note">not mapped</span>'}</td><td>${r.indirectPo!=null?r.indirectPo.toFixed(2):'<span class="small-note">no responses yet</span>'}</td><td><b>${r.value.toFixed(2)}</b></td></tr>`).join('')}
      </table></div>`}
    </div>` : `<div class="card"><p class="small-note">PO / PSO Attainment (Section 6) is calculated for Final Year (Semester 6) courses only.</p></div>`}
    <div class="card">
      <button class="btn btn-outline" id="att-export">Export Course Attainment Report (Excel)</button>
      <button class="btn btn-outline" id="att-export-pdf" style="margin-left:8px;">Download PDF Report</button>
    </div>
  `;
}

function exportAttainmentSheet(course, inputs, cos, coIndirect, courseIndirect, mapping, pos, programByPo, comps, isFinalYear, abbr, serial){
  const {intLevel, extLevel, direct, indirect, final, coAttainment} = computeAttainment(inputs, cos, coIndirect, courseIndirect, mapping, pos, programByPo);
  const copoRows = computeCopoAttainment(direct, cos, pos, mapping);
  const wb = XLSX.utils.book_new();

  const summaryAoa = [
    ['ATTAINMENT CALCULATION'],
    ['Subject & Sub Code', course.code+' — '+course.name],
    ['Semester', course.semester],
    [],
    ['INTERNAL / EXTERNAL COMPONENTS (from Result Sheet)'],
    ['Column','Group','Appeared','≥ Benchmark','%','Level'],
    ...comps.map(x=>[x.header, x.role==='internal'?'Internal':'External', x.appeared, x.above, Number(x.pct.toFixed(2)), Number(x.level.toFixed(2))]),
    [],
    ['DIRECT ATTAINMENT'],
    ['Internal Level', Number(intLevel.toFixed(3))],
    ['External Level', Number(extLevel.toFixed(3))],
    ['Direct Attainment = 0.8×External + 0.2×Internal', Number(direct.toFixed(3))],
    [],
    ['INDIRECT ATTAINMENT (from Course Exit Survey)'],
    ['Course Outcome','Statement','Responses','Average Rating'],
    ...cos.map(co=>[co.code, co.text||'', coIndirect[co.id].count, coIndirect[co.id].avg!=null?Number(coIndirect[co.id].avg.toFixed(3)):'']),
    ['Course-wide Indirect Attainment (average)', '', courseIndirect.count, Number(indirect.toFixed(3))],
    [],
    ['FINAL ATTAINMENT'],
    ['= 0.8 × Direct Attainment + 0.2 × Indirect Attainment'],
    [`= 0.8 * ${direct.toFixed(2)} + 0.2 * ${indirect.toFixed(2)}`, Number(final.toFixed(3))],
  ];
  const ws1 = XLSX.utils.aoa_to_sheet(summaryAoa);
  XLSX.utils.book_append_sheet(wb, ws1, 'Attainment Calculation');

  const coRows = cos.map(co=>{
    const strengths = pos.map(p=> mapCell(mapping[co.id] ? (mapping[co.id][p.id]||0) : 0));
    return [co.code, co.text, Number(coAttainment[co.id].toFixed(3)), ...strengths];
  });
  const coAoa = [['CO Code','CO Statement','CO Attainment', ...pos.map(p=>p.code)], ...coRows];
  const ws2 = XLSX.utils.aoa_to_sheet(coAoa);
  XLSX.utils.book_append_sheet(wb, ws2, 'CO-PO Mapping');

  if(pos.length){
    const poAoa = [
      ['COPO Attainment Calculation'],
      ['(Attainment of relevant COs × Actual mapping strength) / (Maximum mapping strength)'],
      [],
      ['Average Course Outcomes', ...pos.map(p=>p.code)],
      ['Average Course Outcomes', ...copoRows.map(r=>r.value!=null?Number(r.value.toFixed(3)):'-')],
      [],
      ['Course','Abr','Code','Final CO', ...pos.map(p=>p.code)],
      [serial||'', abbr||'', course.code, Number(final.toFixed(3)), ...copoRows.map(r=>r.value!=null?Number(r.value.toFixed(3)):'-')]
    ];
    const ws3 = XLSX.utils.aoa_to_sheet(poAoa);
    XLSX.utils.book_append_sheet(wb, ws3, 'COPO Attainment');
  }

  XLSX.writeFile(wb, `attainment_${course.code}_sem${course.semester}.xlsx`);
}

function exportAttainmentPDF(course, inputs, cos, coIndirect, courseIndirect, mapping, pos, programByPo, comps, isFinalYear, abbr, serial){
  const {intLevel, extLevel, direct, indirect, final, coAttainment} = computeAttainment(inputs, cos, coIndirect, courseIndirect, mapping, pos, programByPo);
  const copoRows = computeCopoAttainment(direct, cos, pos, mapping);
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  let y = 14;

  doc.setFontSize(14); doc.setFont(undefined,'bold');
  doc.text('ATTAINMENT CALCULATION', 105, y, {align:'center'}); y+=8;
  doc.setFontSize(12); doc.setFont(undefined,'normal');
  doc.text(`Subject & Sub Code : ${course.name}`, 14, y); y+=6;
  doc.text(`${course.code}   Semester ${course.semester}`, 14, y); y+=8;

  if(cos.length && pos.length){
    doc.autoTable({
      startY:y,
      head:[['COPO Mapping', ...pos.map(p=>p.code)]],
      body: cos.map(co=>[co.code, ...pos.map(p=>String(mapCell(mapping[co.id]?mapping[co.id][p.id]:0)))]),
      styles:{fontSize:12}, headStyles:{fillColor:[18,42,82]}
    });
    y = doc.lastAutoTable.finalY + 4;
    doc.setFontSize(12); doc.text('CO level taken From Result', 14, y); y+=6;
  }

  if(comps.length){
    doc.autoTable({
      startY:y,
      head:[['Column','Group','%','Level']],
      body: comps.map(x=>[x.header, x.role==='internal'?'Internal':'External', x.pct.toFixed(1)+'%', x.level.toFixed(2)]),
      styles:{fontSize:12}, headStyles:{fillColor:[18,42,82]}
    });
    y = doc.lastAutoTable.finalY + 4;
  }

  doc.setFont(undefined,'bold'); doc.setFontSize(12); doc.text('DIRECT ATTAINMENT', 14, y); doc.setFont(undefined,'normal'); y+=6;
  doc.setFontSize(12); doc.text(`= 0.8 × External (${extLevel.toFixed(2)}) + 0.2 × Internal (${intLevel.toFixed(2)}) = ${direct.toFixed(2)}`, 14, y); y+=8;

  doc.setFont(undefined,'bold'); doc.setFontSize(12); doc.text('INDIRECT ATTAINMENT (from course exit survey)', 14, y); doc.setFont(undefined,'normal'); y+=6;
  if(cos.length){
    doc.autoTable({
      startY:y,
      head:[['Course Outcomes', ...cos.map(co=>co.code)]],
      body:[['Average', ...cos.map(co=>coIndirect[co.id].avg!=null?coIndirect[co.id].avg.toFixed(2):'-')]],
      styles:{fontSize:12}, headStyles:{fillColor:[18,42,82]}
    });
    y = doc.lastAutoTable.finalY + 4;
  }
  doc.setFontSize(12); doc.text(`Average = ${indirect.toFixed(2)}`, 14, y); y+=8;

  doc.setFont(undefined,'bold'); doc.setFontSize(12); doc.text('FINAL ATTAINMENT', 14, y); doc.setFont(undefined,'normal'); y+=6;
  doc.setFontSize(12); doc.text(`= 0.8 × Direct Attainment + 0.2 × Indirect Attainment`, 14, y); y+=6;
  doc.setFontSize(12); doc.text(`= 0.8 * ${direct.toFixed(2)} + 0.2 * ${indirect.toFixed(2)} = ${final.toFixed(2)}`, 14, y); y+=10;

  if(pos.length){
    if(y>240){ doc.addPage(); y=14; }
    doc.setFont(undefined,'bold'); doc.setFontSize(12); doc.text('COPO Attainment Calculation', 14, y); doc.setFont(undefined,'normal'); y+=5;
    doc.setFontSize(12); doc.text('(Attainment of relevant COs x Actual mapping strength) / (Maximum mapping strength)', 14, y); y+=6;
    doc.autoTable({
      startY:y,
      head:[['Average Course Outcomes', ...pos.map(p=>p.code)]],
      body:[['Average Course Outcomes', ...copoRows.map(r=>r.value!=null?r.value.toFixed(2):'-')]],
      styles:{fontSize:12}, headStyles:{fillColor:[18,42,82]}
    });
    y = doc.lastAutoTable.finalY + 8;
    if(y>240){ doc.addPage(); y=14; }
    doc.setFont(undefined,'bold'); doc.setFontSize(12); doc.text('COPO Attainment', 14, y); doc.setFont(undefined,'normal'); y+=6;
    doc.autoTable({
      startY:y,
      head:[['Course','Abr','Code','Final CO', ...pos.map(p=>p.code)]],
      body:[[serial||'', abbr||'', course.code, final.toFixed(2), ...copoRows.map(r=>r.value!=null?r.value.toFixed(2):'-')]],
      styles:{fontSize:12}, headStyles:{fillColor:[18,42,82]}
    });
  }

  doc.save(`attainment_${course.code}_sem${course.semester}.pdf`);
}
</script>
